name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - run: make test

  config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # compare reads the base branch's config and scores from git.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.3.3
      - run: make validate
      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          set -o pipefail
          make --silent compare BASE="$BASE" | tee -a "$GITHUB_STEP_SUMMARY"
