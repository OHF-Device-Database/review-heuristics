[project]
name = "ddb-checks"
version = "0.1.0"
description = "Applies the contribution check configuration to model scores, and benchmarks it."
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.28", "jsonschema>=4.23"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
