target-version = "py312"
line-length = 100

[lint]
select = ["A", "B", "C4", "D", "E", "F", "I", "N", "PL", "PT", "RUF", "S", "SIM", "UP", "W"]
# D213 (summary on the second line) is the OHF convention; D212 and D203 contradict it.
ignore = ["D203", "D212", "PLR0913"]

[lint.per-file-ignores]
"*/tests/*" = ["D", "S101", "S106", "PLR2004"]

[lint.isort]
known-first-party = ["ddb_checks", "ddb_eval", "ddb_serve"]
