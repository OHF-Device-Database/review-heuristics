[project]
name = "ddb-serve"
version = "0.1.0"
description = "Serves the contribution checks for the Device Database review bot."
requires-python = ">=3.12,<3.13"
dependencies = [
    "ddb-checks",
    "fastapi>=0.115",
    "fasttext-predict>=0.9.2.4",
    "numpy>=2.2",
    "onnxruntime>=1.22",
    "pillow>=11",
    "prometheus-client>=0.21",
    "tokenizers>=0.21",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = ["httpx>=0.28", "onnx>=1.20", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
